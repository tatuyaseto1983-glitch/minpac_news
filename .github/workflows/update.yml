name: サイト更新（毎日）

on:
  schedule:
    - cron: '20 20 * * *' # 毎日 05:20 JST
  workflow_dispatch:
    inputs:
      estat_mode:
        description: 'e-Stat の動作'
        type: choice
        default: '取り込む'
        options: ['取り込む', '表の一覧を出す', 'キーワード検索']
      estat_word:
        description: 'キーワード検索のことば'
        type: string
        default: '延べ宿泊者数'
  push:
    # 既定のブランチが main ではないため、実際のブランチ名も入れておく
    branches: [main, claude/minpaku-news-site-requirements-sh1pfo]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # PDFの表を文字に起こすために使います（scripts/lib/pdf.mjs）
      - name: PDFを読む道具を入れる
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: 読み取り処理の自己点検
        run: npm test

      - name: 行政サイトから収集
        run: npm run fetch

      - name: e-Stat から統計を取り込む
        env:
          # リポジトリの Settings → Secrets and variables → Actions に登録してください
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
          # 入力は環境変数に受けてから使う（コマンドに直接埋め込まない）。
          # inputs は手動実行のときにしか存在しないため、常に参照できる
          # github.event.inputs を使う（プッシュや定期実行では空になる）
          ESTAT_MODE: ${{ github.event.inputs.estat_mode }}
          ESTAT_WORD: ${{ github.event.inputs.estat_word }}
        run: |
          case "$ESTAT_MODE" in
            "表の一覧を出す") npm run estat -- --list ;;
            "キーワード検索") npm run estat -- --search "$ESTAT_WORD" ;;
            *)                npm run estat ;;
          esac

      - name: 収集結果をコミット
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/articles.json data/stats.json data/estat.json data/documents.json data/municipalities.json data/filings.json
          git diff --staged --quiet || git commit -m "データ更新: $(date -u +%Y-%m-%d)"
          git push
        continue-on-error: true

      # Pages の初回の有効化だけは、リポジトリの Settings → Pages で
      # Source を「GitHub Actions」にする必要があります（ワークフローの権限では作成できません）
      - uses: actions/configure-pages@v5
        id: pages

      - name: サイトを生成
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
